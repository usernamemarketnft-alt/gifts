<!DOCTYPE html>
<html lang="ar" dir="rtl" data-t="neon">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أكاديمية C++</title><meta name="theme-color" content="#0b0d1a">
<style>
[data-t=neon]{--b1:#0b0d1a;--b2:#1b1f4a;--cd:#151933;--tx:#eef0ff;--mu:#9aa0c8;--c:#6c8cff;--d:#ff6cc3}
[data-t=ocean]{--b1:#021824;--b2:#07485e;--cd:#0b2c3d;--tx:#e6fbff;--mu:#8fc3d1;--c:#18d0e8;--d:#3d8bff}
[data-t=sunset]{--b1:#1c0a14;--b2:#4a1530;--cd:#2b1020;--tx:#fff0e8;--mu:#d4a3a0;--c:#ff7a45;--d:#ff3d81}
[data-t=forest]{--b1:#06140c;--b2:#12402a;--cd:#0e2619;--tx:#eaffee;--mu:#93c4a0;--c:#2fd28a;--d:#b6e84a}
[data-t=candy]{--b1:#1d0f2a;--b2:#44195e;--cd:#2c1640;--tx:#fff0fb;--mu:#cba6d8;--c:#ff5fd0;--d:#a98bff}
[data-t=gold]{--b1:#120e04;--b2:#3a2c06;--cd:#201a08;--tx:#fff8e0;--mu:#cdbb83;--c:#ffc933;--d:#ff9d1a}
[data-t=matrix]{--b1:#000;--b2:#031a06;--cd:#06120a;--tx:#c8ffd4;--mu:#5fae73;--c:#00ff59;--d:#00c2a8}
[data-t=snow]{--b1:#eef2ff;--b2:#d8e2ff;--cd:#fff;--tx:#1a1f3d;--mu:#5d6590;--c:#4263ff;--d:#a24bff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(160deg,var(--b2),var(--b1) 60%) fixed;color:var(--tx);font-family:system-ui,Tahoma,sans-serif;min-height:100vh;line-height:1.8}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 12px;background:color-mix(in srgb,var(--b1) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid #8883}
header h1{font-size:16px;flex:1;cursor:pointer;background:linear-gradient(90deg,var(--c),var(--d));-webkit-background-clip:text;color:transparent}
.xp{font-size:12px;background:#8832;padding:4px 10px;border-radius:20px}
button{font-family:inherit;cursor:pointer;border:0;color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;background:linear-gradient(90deg,var(--c),var(--d))}
button.g{background:#8833;color:var(--tx)}button:disabled{opacity:.5}
main{max-width:780px;margin:auto;padding:14px}
.card{background:var(--cd);border:1px solid #8832;border-radius:18px;padding:16px;margin-bottom:14px}
.hero{border-top:3px solid var(--c)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--cd);border:1px solid #8832;border-radius:18px;padding:14px;cursor:pointer;position:relative;overflow:hidden;min-height:120px}
.tile::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--k)}
.tile b{display:block;font-size:15px;margin:4px 0}.tile span{font-size:30px}.tile small{color:var(--mu)}
.pg{height:6px;background:#8833;border-radius:6px;margin-top:8px}.pg i{display:block;height:100%;border-radius:6px;background:var(--k)}
.it{display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;background:var(--cd);margin-bottom:8px;border-right:4px solid var(--k);cursor:pointer}
.it.d::after{content:"✓";margin-right:auto;color:#2fd28a}
pre{direction:ltr;text-align:left;background:#0007;color:#d7c4ff;border-radius:12px;padding:12px;overflow:auto;font-size:13px;margin:10px 0}
[data-t=snow] pre{background:#1a1f3d;color:#e0e6ff}
code{direction:ltr;unicode-bidi:embed;font-family:monospace}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
textarea,input{width:100%;background:#0005;color:var(--tx);border:1px solid #8835;border-radius:12px;padding:10px;font-family:monospace;font-size:14px}
[data-t=snow] textarea,[data-t=snow] input{background:#fff}
textarea{direction:ltr;text-align:left;min-height:140px}
.op{display:block;width:100%;text-align:right;margin:6px 0;background:#8832;color:var(--tx)}
.ok{background:#12a15a!important;color:#fff!important}.no{background:#c93a4d!important;color:#fff!important}
.ai{background:#0003;border:1px solid #8835;border-radius:12px;padding:12px;margin-top:10px;white-space:pre-wrap;word-break:break-word}
.ai.good{border-color:#12a15a}.ai.bad{border-color:#c93a4d}
.sp{display:inline-block;width:14px;height:14px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:r 1s linear infinite;vertical-align:middle}
@keyframes r{to{transform:rotate(360deg)}}
.th{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sw{height:54px;border-radius:12px;border:2px solid transparent;font-size:11px;display:flex;align-items:flex-end;justify-content:center;padding:4px;color:#fff;text-shadow:0 1px 3px #000}
.sw.a{border-color:var(--tx)}
.small{color:var(--mu);font-size:13px}.tag{background:var(--k,var(--c));color:#fff;padding:2px 10px;border-radius:20px;font-size:12px}
.kk{display:flex;gap:6px;align-items:center;margin-bottom:6px}.kk i{font-style:normal;width:24px;text-align:center}
.kk.on i{color:#2fd28a}
.cw{position:relative}.cp{position:absolute;top:14px;left:6px;padding:4px 10px;font-size:12px}
[data-t=custom]{--b1:#0b0d1a;--b2:#1b1f4a;--cd:#151933;--tx:#eef0ff;--mu:#9aa0c8;--c:#6c8cff;--d:#ff6cc3}
.k{color:#ff7ab2}.s{color:#9be28a}.c{color:#7f8aa8}.n{color:#ffcf6b}.p{color:#6ee7ff}
input[type=color]{width:70px;height:42px;padding:2px}
.ic{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.22em}.ic svg{width:100%;height:100%}
.im{position:relative;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,var(--k,var(--c)),var(--d));display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.im svg{height:58%;width:auto;aspect-ratio:1/1}.im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
select{width:100%;background:#0005;color:var(--tx);border:1px solid #8835;border-radius:12px;padding:10px;font-family:inherit}option{color:#000}
.lg{width:30px;height:30px;border-radius:8px;vertical-align:middle;margin-left:6px;-webkit-text-fill-color:initial}.hl{display:block;margin:0 auto 12px;width:min(72%,280px);border-radius:22px}
</style>
</head>
<body>
<header><button class="g" onclick="V('home')">🏠</button><h1 onclick="V('home')"><img alt="" class="lg"> أكاديمية C++</h1><span class="xp" id="xp"></span><button class="g" onclick="V('set')">⚙️</button></header>
